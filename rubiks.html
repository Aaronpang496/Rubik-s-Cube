<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Rubik's Cube</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background-color: #0f172a;
    touch-action: none; font-family: system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  * { box-sizing: border-box; }
  canvas { display: block; width: 100%; height: 100%; }

  #ui {
    position: absolute; top: 20px; left: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none; color: white; z-index: 10;
  }
  #timer {
    font-size: 56px; font-weight: bold;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    color: #facc15; transition: color 0.3s;
  }
  #timer.running { color: #22c55e; }

  .btn-row {
    margin-top: 15px; display: flex; gap: 12px; pointer-events: auto;
  }
  button {
    padding: 12px 28px; font-size: 18px; font-weight: bold;
    background: #2563eb; color: white; border: none;
    border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    transition: 0.2s;
  }
  button:active { background: #1d4ed8; transform: scale(0.95); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #start-btn.hidden { display: none; }

  #instruction {
    margin-top: 10px; font-size: 14px; color: #94a3b8;
    background: rgba(0,0,0,0.6); padding: 6px 16px;
    border-radius: 20px; pointer-events: none;
    backdrop-filter: blur(4px);
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="ui">
  <div id="timer">0:00.0</div>
  <div class="btn-row">
    <button id="start-btn">START TIMER</button>
    <button id="scramble-btn">SCRAMBLE</button>
  </div>
  <div id="instruction">Swipe on a face to twist</div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // --- TIMER ---
  const timerDisplay = document.getElementById('timer');
  const startBtn = document.getElementById('start-btn');
  const scrambleBtn = document.getElementById('scramble-btn');
  let startTime = null;
  let isRunning = false;

  function updateTimer() {
    if (!isRunning) return;
    const elapsed = Date.now() - startTime;
    const m = Math.floor(elapsed / 60000);
    const s = Math.floor((elapsed % 60000) / 1000);
    const t = Math.floor((elapsed % 1000) / 100);
    timerDisplay.textContent = `${m}:${String(s).padStart(2, '0')}.${t}`;
    requestAnimationFrame(updateTimer);
  }

  startBtn.addEventListener('click', () => {
    if (isRunning) return;
    isRunning = true;
    startTime = Date.now();
    startBtn.classList.add('hidden');
    timerDisplay.classList.add('running');
    updateTimer();
  });

  // --- SCENE ---
  const container = document.body;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.set(5.5, 5.5, 7.5);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.enableZoom = true;
  controls.enablePan = false;
  controls.rotateSpeed = 0.8;
  controls.minDistance = 4;
  controls.maxDistance = 20;
  controls.target.set(0, 0, 0);
  controls.update();

  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
  dirLight.position.set(10, 15, 10);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
  fillLight.position.set(-10, -8, -10);
  scene.add(fillLight);
  const topLight = new THREE.DirectionalLight(0xffffff, 0.3);
  topLight.position.set(0, 20, 0);
  scene.add(topLight);

  // --- CUBE ---
  const size = 0.95;
  const gap = 1;
  const colors = {
    right: 0xff0000, left: 0xff8800, top: 0xffffff,
    bottom: 0xffdd00, front: 0x00ff00, back: 0x0000ff
  };

  const cubeGroup = new THREE.Group();
  scene.add(cubeGroup);
  const cubes = [];

  function makeMat(color) {
    return new THREE.MeshStandardMaterial({
      color,
      roughness: 0.5,
      metalness: 0.1,
      flatShading: false,
      side: THREE.FrontSide,
      envMapIntensity: 0
    });
  }

  for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
      for (let z = -1; z <= 1; z++) {
        const mats = [
          makeMat(x === 1 ? colors.right : 0x111111),
          makeMat(x === -1 ? colors.left : 0x111111),
          makeMat(y === 1 ? colors.top : 0x111111),
          makeMat(y === -1 ? colors.bottom : 0x111111),
          makeMat(z === 1 ? colors.front : 0x111111),
          makeMat(z === -1 ? colors.back : 0x111111)
        ];
        const cube = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), mats);
        cube.position.set(x * gap, y * gap, z * gap);
        cube.userData.logicalPos = new THREE.Vector3(x, y, z);
        cubeGroup.add(cube);
        cubes.push(cube);
      }
    }
  }

  // --- RAYCASTING / SWIPE ---
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let pointerDown = false, activeFace = null, isAnimating = false;
  let pointerDownPos = new THREE.Vector2();
  let pointerDownTime = 0;
  const swipeThreshold = 15;
  const swipeTimeThreshold = 300;

  let animGroup = null;
  let animAxis = null;
  let animAngle = 0;
  let animStart = 0;
  let animDuration = 220;
  let animCubes = [];

  function getFaceNormal(face, obj) {
    const nm = new THREE.Matrix3().getNormalMatrix(obj.matrixWorld);
    return face.normal.clone().applyMatrix3(nm).normalize();
  }

  function getCubesOnFace(normal) {
    const ax = Math.abs(normal.x), ay = Math.abs(normal.y), az = Math.abs(normal.z);
    let axis, layer;
    if (ax >= ay && ax >= az) { axis = 'x'; layer = Math.sign(normal.x); }
    else if (ay >= ax && ay >= az) { axis = 'y'; layer = Math.sign(normal.y); }
    else { axis = 'z'; layer = Math.sign(normal.z); }

    const faceCubes = cubes.filter(c => {
      const p = c.userData.logicalPos;
      if (axis === 'x') return Math.abs(p.x - layer) < 0.1;
      if (axis === 'y') return Math.abs(p.y - layer) < 0.1;
      return Math.abs(p.z - layer) < 0.1;
    });
    return { axis, layer, faceCubes, normal };
  }

  function getSwipeDirection(start, end) {
    const dx = end.x - start.x, dy = end.y - start.y;
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
    return dy > 0 ? 'down' : 'up';
  }

  function getRotationFromSwipe(faceInfo, dir) {
    const n = faceInfo.normal.clone().normalize();
    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    const sr = camRight.clone().sub(n.clone().multiplyScalar(camRight.dot(n))).normalize();
    const su = camUp.clone().sub(n.clone().multiplyScalar(camUp.dot(n))).normalize();

    let swipe3D;
    switch (dir) {
      case 'right': swipe3D = sr; break;
      case 'left': swipe3D = sr.clone().negate(); break;
      case 'up': swipe3D = su; break;
      case 'down': swipe3D = su.clone().negate(); break;
    }
    const rot = new THREE.Vector3().crossVectors(n, swipe3D).normalize();
    const ax = Math.abs(rot.x), ay = Math.abs(rot.y), az = Math.abs(rot.z);
    let axis;
    if (ax >= ay && ax >= az) axis = new THREE.Vector3(Math.sign(rot.x), 0, 0);
    else if (ay >= ax && ay >= az) axis = new THREE.Vector3(0, Math.sign(rot.y), 0);
    else axis = new THREE.Vector3(0, 0, Math.sign(rot.z));

    const angle = Math.PI / 2 * Math.sign(rot.dot(axis));
    return { axis, angle };
  }

  function rotateFace(faceInfo, axis, angle, onComplete) {
    if (isAnimating) return;
    isAnimating = true;

    const group = new THREE.Group();
    scene.add(group);
    animGroup = group;
    animCubes = faceInfo.faceCubes.slice();
    animAxis = axis;
    animAngle = angle;
    animStart = performance.now();
    group.userData.onComplete = onComplete || null;

    animCubes.forEach(c => group.attach(c));
  }

  function updateAnimation(now) {
    if (!animGroup || !animAxis) return;
    const t = Math.min((now - animStart) / animDuration, 1);
    const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    animGroup.rotation.set(0, 0, 0);
    animGroup.rotateOnAxis(animAxis, animAngle * eased);

    if (t >= 1) {
      const done = animGroup.userData.onComplete;

      animCubes.forEach(c => {
        cubeGroup.attach(c);
        // snap position to grid
        c.position.set(
          Math.round(c.position.x),
          Math.round(c.position.y),
          Math.round(c.position.z)
        );
        // CRITICAL: normalize quaternion to kill float drift
        c.quaternion.normalize();
        // force matrix + world matrix update so lighting is correct
        c.updateMatrix();
        c.updateMatrixWorld(true);
        c.userData.logicalPos.set(c.position.x, c.position.y, c.position.z);
      });

      animGroup.rotation.set(0, 0, 0);
      scene.remove(animGroup);
      animGroup = null;
      animAxis = null;
      animCubes = [];
      isAnimating = false;

      if (done) done();
    }
  }

  // --- SCRAMBLE ---
  const FACE_NORMALS = [
    new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0),
    new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1, 0),
    new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1)
  ];

  function randomScrambleMove() {
    const normal = FACE_NORMALS[Math.floor(Math.random() * 6)].clone();
    const faceInfo = getCubesOnFace(normal);
    if (faceInfo.faceCubes.length !== 9) return null;

    const axes = [];
    if (Math.abs(normal.x) < 0.1) axes.push(new THREE.Vector3(1, 0, 0));
    if (Math.abs(normal.y) < 0.1) axes.push(new THREE.Vector3(0, 1, 0));
    if (Math.abs(normal.z) < 0.1) axes.push(new THREE.Vector3(0, 0, 1));
    const axis = axes[Math.floor(Math.random() * axes.length)];
    const angle = (Math.random() > 0.5 ? 1 : -1) * Math.PI / 2;

    return { faceInfo, axis, angle };
  }

  function doScramble(count = 20) {
    if (isAnimating) return;
    scrambleBtn.disabled = true;
    let i = 0;
    function next() {
      if (i >= count) { scrambleBtn.disabled = false; return; }
      const move = randomScrambleMove();
      if (!move) { i++; next(); return; }
      i++;
      rotateFace(move.faceInfo, move.axis, move.angle, next);
    }
    next();
  }

  scrambleBtn.addEventListener('click', () => doScramble(20));

  // --- POINTER EVENTS ---
  function onPointerDown(e) {
    if (isAnimating) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(cubes);
    if (hits.length === 0) return;

    const hit = hits[0];
    const wn = getFaceNormal(hit.face, hit.object);
    const ax = Math.abs(wn.x), ay = Math.abs(wn.y), az = Math.abs(wn.z);
    let normal;
    if (ax >= ay && ax >= az) normal = new THREE.Vector3(Math.sign(wn.x), 0, 0);
    else if (ay >= ax && ay >= az) normal = new THREE.Vector3(0, Math.sign(wn.y), 0);
    else normal = new THREE.Vector3(0, 0, Math.sign(wn.z));

    const faceInfo = getCubesOnFace(normal);
    if (faceInfo.faceCubes.length === 9) {
      activeFace = faceInfo;
      pointerDown = true;
      pointerDownPos.set(e.clientX, e.clientY);
      pointerDownTime = performance.now();
      controls.enabled = false;
    }
  }

  function onPointerUp(e) {
    if (!pointerDown || !activeFace || isAnimating) {
      pointerDown = false; activeFace = null; controls.enabled = true;
      return;
    }
    const elapsed = performance.now() - pointerDownTime;
    const end = new THREE.Vector2(e.clientX, e.clientY);
    const dist = end.distanceTo(pointerDownPos);

    if (dist >= swipeThreshold && elapsed < swipeTimeThreshold) {
      const dir = getSwipeDirection(pointerDownPos, end);
      const { axis, angle } = getRotationFromSwipe(activeFace, dir);
      if (axis) rotateFace(activeFace, axis, angle, null);
    }
    pointerDown = false; activeFace = null; controls.enabled = true;
  }

  function onPointerCancel() {
    pointerDown = false; activeFace = null; controls.enabled = true;
  }

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  renderer.domElement.addEventListener('pointercancel', onPointerCancel);
  renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

  // --- RESIZE (hardened) ---
  function handleResize() {
    const w = Math.max(container.clientWidth, 100);
    const h = Math.max(container.clientHeight, 100);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);   // no `false` — updates canvas CSS too
  }
  window.addEventListener('resize', handleResize);
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(handleResize).observe(container);

  // Call once synchronously, then re-assert camera after aspect is sane
  handleResize();
  camera.position.set(5.5, 5.5, 7.5);
  camera.lookAt(0, 0, 0);
  controls.target.set(0, 0, 0);
  controls.update();

  // --- LOOP ---
  function animate(now) {
    requestAnimationFrame(animate);
    if (animGroup) updateAnimation(now || performance.now());
    controls.update();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  setTimeout(() => {
    const el = document.getElementById('instruction');
    if (el) { el.style.transition = 'opacity 0.5s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 500); }
  }, 5000);
</script>
</body>
</html>
